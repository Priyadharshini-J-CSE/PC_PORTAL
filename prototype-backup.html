<style>

nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nb{background:transparent;color:var(--t2);border:0;font-weight:500}.nb:hover{color:var(--t);background:var(--mu)}.nb.on{color:var(--o)}.nb.cta{background:var(--o);color:#fff}.nb.cta:hover{background:var(--oh);color:#fff}
main{max-width:1180px;margin:0 auto;padding:32px 24px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}

input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:9px;font:inherit;background:#fff;color:var(--t)}

button:hover{background:var(--oh)}
button.s{background:#fff;color:var(--t);border:1px solid var(--b)}button.s:hover{background:var(--mu)}
button.d{background:#fff;color:var(--err);border:1px solid var(--b);padding:4px 9px}button.d:hover{background:#fbeeea}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.row input{max-width:280px}
.msg{color:var(--err);font-size:.85rem;margin-top:10px}.ok{color:var(--ok)}
.tag{display:inline-block;background:#FBEDE5;color:var(--o);border-radius:999px;padding:2px 11px;font-weight:600;font-size:.75rem}
.round{background:var(--mu);border-left:3px solid var(--o);padding:8px 12px;margin:8px 0;border-radius:8px;white-space:pre-wrap}
a{color:var(--o)}
.hl{color:var(--o)}
input[type=checkbox]{width:auto;accent-color:var(--o);transform:scale(1.2)}.round.f{white-space:normal}th.sr{cursor:pointer;user-select:none}td.ed{cursor:cell}
.hero2{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:36px 0 56px}

.pv{padding:26px;border-radius:20px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mini div{background:var(--mu);border-radius:12px;padding:14px}.mini b{display:block;font-size:1.6rem}.mini span{font-size:.78rem;color:var(--t2)}
.bar{margin:10px 0;font-size:.8rem;color:var(--t2)}.bar i{display:block;height:8px;border-radius:99px;background:var(--mu);margin-top:4px;overflow:hidden}.bar i u{display:block;height:100%;background:var(--o);border-radius:99px}
.sec-t{text-align:center;margin:20px 0 22px;font-size:1.8rem}
.step{font-size:.75rem;font-weight:700;color:var(--o)}
.login{max-width:410px;margin:48px auto;padding:30px}.login h2{margin:14px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{padding:18px}.stat svg{color:var(--o);margin:0 0 6px;font-size:1.1rem}.stat b{display:block;font-size:1.7rem}.stat span{font-size:.8rem;color:var(--t2)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--b);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .rl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin:18px 10px 8px}
.side .mi{background:transparent;color:var(--t2);border:0;text-align:left;font-weight:500;padding:10px 12px;border-radius:10px;width:100%}
.side .mi:hover{background:var(--mu);color:var(--t)}.side .mi.on{background:#FBEDE5;color:var(--o);font-weight:600}
.side .lo{margin-top:auto}
.content{padding:28px 36px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.top small{color:var(--t2)}.top h1{margin:2px 0 0;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
.chip{background:#fff;border:1px solid var(--b);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem}
@media(max-width:860px){.hero2{grid-template-columns:1fr;gap:28px}.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--b);padding:12px}.side .rl,.side .brand{display:none}.side .mi{width:auto}.side .lo{margin:0 0 0 auto}.content{padding:20px 16px}header{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

['ihP','Int. Hack Part.'],['ihW','Int. Hack Won'],['ehP','Ext. Hack Part.'],['ehW','Ext. Hack Won'],['eoP','Ext. Online Part.'],['eoW','Ext. Online Won'],['intern','Ext. Intern'],['iPlace','Intern Place'],['iMode','Intern Mode'],['iStip','Stipend'],['cert','Prof. Cert'],['certLink','Cert Link']];

const LG=[['name','Student Name'],['roll','Roll No.'],['paid','Paid?'],['amt','Amount'],['exam','Exam Status'],['slot','Slot'],['res','Result']];

 DB={users:{pc:[{email:'pc@sece.ac.in',pw:'pc'}],faculty:[{email:'faculty@sece.ac.in',pw:'faculty'}]},spw:{},st:{},lc:{},iv:[],lg:[]};
 ROLLS.forEach((r,i)=>DB.st[r]={roll:r,name:'Student '+r,dept:'CSE',year:'III',intern:'No',cert:'No',ihP:0,ihW:0,ehP:0,ehW:0,eoP:0,eoW:0});
 const d1=`Arun Kumar S|24CS141|C, C++, Java, SQL|9000000001|Hostel|7241001401|Male|2005-02-14|IT|College Bus|91.20|94.50|N/A|9.10|0|0|arun.mock@sece.ac.in|arun.mock@example.com|Full Stack Development|Coimbatore, Tamil Nadu

Karthik M|24CS143|Java, DSA, MySQL|9000000003|Hostel|7241001403|Male|2004-11-09|Core|College Bus|88.40|90.10|N/A|8.75|1|0|karthik.mock@sece.ac.in|karthik.mock@example.com|Java Development|Erode, Tamil Nadu
Nithya S|24CS144|Python, Machine Learning|9000000004|Dayscholar|7241001404|Female|2005-01-30|IT|College Bus|93.60|95.80|N/A|9.45|0|0|nithya.mock@sece.ac.in|nithya.mock@example.com|Data Science|Coimbatore, Tamil Nadu

 d1.split('\n').forEach(l=>{const a=l.split('|'),k=['name','roll','skills','mobile','hostel','regno','gender','dob','itcore','transport','p10','p12','diploma','cgpa','arrHist','arrStand','dmail','pmail','domain','address'],o=DB.st[a[1]];k.forEach((x,i)=>o[x]=a[i]);o.resume='https://example.com/resume/'+a[1];o.video='https://example.com/video/'+a[1];o.portfolio='https://example.com/portfolio/'+a[1]});
 Object.assign(DB.st['24CS141'],{cgpa:8.865,ihP:7,ihW:1,ehP:1,eoP:5});Object.assign(DB.st['24CS142'],{cgpa:8.23,ihP:2,ehP:4,intern:'Yes',iPlace:'Zoho',iMode:'Offline',iStip:'Yes'});
 DB.lc['24CS141']={roll:'24CS141',user:'arun_k',gr:152340,cr:48210,ca:12,tot:410,e:180,m:200,h:30};
 DB.lg.push({name:'Arun Kumar S',roll:'24CS141',paid:'Yes',amt:1500,exam:'Completed',slot:'10 AM',res:'Pass'});
}
try{DB=JSON.parse(localStorage.getItem('sece_pp'))}catch(e){}
if(!DB||!DB.st)seed();
const ro=()=>S&&S.role==='faculty';
function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function dl(name,rows){const t=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}

const ic=n=>`<i class="fa-solid fa-${n}"></i>`;
let sel=false;

const TITLES={dash:'Dashboard',students:'Students',leet:'LeetCode',iv:'Post-Interview Inquiry',lg:'Lingua Skills',profile:'My Profile',form:'Interview Experiences'};
const menu=()=>S.role==='student'?[['dash','gauge','Dashboard'],['profile','id-card','My Profile'],['form','comments','Interview Experiences']]:[['dash','gauge','Dashboard'],['students','users','Students'],['leet','code','LeetCode'],['iv','comments','Post-Interview'],['lg','language','Lingua Skills']];
function render(){
 document.body.classList.toggle('in',!!S);
 $('nav').innerHTML=S?'':navHtml();
 if(!S){$('app').innerHTML=portal?authView():sel?select():landing();return}
 const body=tab==='dash'?dash():S.role==='student'?(tab==='profile'?sProfile():sForm()):({students:vStudents,leet:vLeet,iv:vIv,lg:vLg}[tab]||vStudents)();
 $('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">${ic('bullseye')}SECE Placement</div><div class="rl">${RN[S.role]}</div>${menu().map(m=>`<button class="mi ${tab==m[0]?'on':''}" onclick="tab='${m[0]}';render()">${ic(m[1])}${m[2]}</button>`).join('')}<button class="s lo" onclick="logout()">${ic('right-from-bracket')}Logout</button></aside>
 <section class="content"><div class="top"><div><small>${RN[S.role]}</small><h1>${TITLES[tab]||''}</h1></div><div class="chip">${ic('user')}${esc(S.id)}</div></div>${ro()&&tab!=='dash'?'<p><span class="tag">'+ic('eye')+'View only</span></p>':''}${body}</section></div>`}
const kp=(i,v,l)=>`<div class="box stat">${ic(i)}<b>${v}</b><span>${l}</span></div>`;
const stg=(h,a)=>`<h3>${h}</h3><div class="stats">${a.join('')}</div>`;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const SA=()=>Object.values(DB.st),nm=r=>(DB.st[r]||{}).name||r;
const lst=a=>a.length?`<ul style="margin:8px 0 0;padding-left:18px">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p style="margin:8px 0 0">Nothing to show yet.</p>';
const pan=(t,h)=>`<div class="box"><b>${t}</b>${h}</div>`;
const two=(a,b)=>`<div class="cards" style="margin-top:16px">${a}${b}</div>`;
const go=(t,l,i)=>`<button class="s" onclick="tab='${t}';render()">${ic(i)}${l}</button>`;
const bars=(o)=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5),m=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(x=>`<div class="bar">${esc(x[0])} · ${x[1]}<i><u style="width:${x[1]/m*100}%"></u></i></div>`).join(''):'<p style="margin:8px 0 0">No data yet.</p>'};
function dash(){return S.role==='pc'?dashPC():S.role==='faculty'?dashFac():dashStu()}
function dashPC(){const A=SA(),L=Object.values(DB.lc),g=DB.lg,paid=g.filter(isPaid),done=g.filter(isDone),pend=paid.filter(r=>!isDone(r)),hv=k=>A.filter(x=>x[k]).length;
 const noLc=A.filter(x=>!DB.lc[x.roll]).length,noRes=A.filter(x=>!x.resume).length,noVid=A.filter(x=>!x.video).length;
 return `<div class="box"><b>Welcome, Placement Coordinator</b><p style="margin-bottom:0">Track data coverage and see what still needs your attention.</p></div>
 ${stg('Data coverage',[kp('users',A.length,'Students'),kp('code',pct(L.length,A.length),'LeetCode IDs added'),kp('id-card',pct(hv('resume'),A.length),'Resumes submitted'),kp('video',pct(hv('video'),A.length),'1-min videos'),kp('comments',DB.iv.length,'Interview sheets')])}
 ${stg('Lingua Skills',[kp('indian-rupee-sign',paid.length,'Paid'),kp('circle-check',done.length,'Exams completed'),kp('hourglass-half',pend.length,'Paid, yet to complete')])}
 ${two(pan('Pending actions',lst([noLc+' students without a LeetCode ID',noRes+' students without a resume link',noVid+' students without a video link',pend.length+' paid students yet to complete Lingua exam'])+'<div class="row">'+go('leet','Add LeetCode IDs','code')+go('lg','Lingua Skills','language')+'</div>'),pan('Latest interview submissions',lst(DB.iv.slice(-5).reverse().map(v=>`${esc(nm(v.roll))} - ${esc(v.company)} (${esc(v.status)})`))+'<div class="row">'+go('iv','View all','comments')+'</div>'))}`}
function dashFac(){const A=SA(),L=Object.values(DB.lc).filter(x=>+x.tot>0).sort((a,b)=>b.tot-a.tot).slice(0,5),cg=A.map(x=>+x.cgpa).filter(x=>x>0),dom={},co={};

 const placed=new Set(DB.iv.filter(v=>v.status==='Placed').map(v=>v.roll)).size,wins=A.reduce((a,x)=>a+(+x.ihW||0)+(+x.ehW||0)+(+x.eoW||0),0),top=A.filter(x=>+x.cgpa>0).sort((a,b)=>b.cgpa-a.cgpa).slice(0,5);
 return `<div class="box"><b>Welcome, Faculty</b><p style="margin-bottom:0">Academic and placement-readiness overview of the class. View-only.</p></div>
 ${stg('Class performance',[kp('chart-line',cg.length?(cg.reduce((a,b)=>a+b,0)/cg.length).toFixed(2):'N/A','Average CGPA'),kp('triangle-exclamation',A.filter(x=>+x.arrStand>0).length,'Students with standing arrears'),kp('trophy',wins,'Hackathons won'),kp('briefcase',A.filter(x=>x.intern==='Yes').length,'External interns'),kp('circle-check',placed,'Students reported placed')])}
 ${two(pan('Top LeetCode solvers',lst(L.map(x=>`${esc(nm(x.roll))} - ${x.tot} solved`))),pan('Top CGPA',lst(top.map(x=>`${esc(x.name)} - ${x.cgpa}`))))}

function dashStu(){const s=DB.st[S.id],l=DB.lc[S.id],my=DB.iv.filter(v=>v.roll===S.id),lr=DB.lg.find(x=>x.roll===S.id);
 const K=[['resume','Resume link'],['portfolio','Portfolio link'],['video','1-minute video'],['domain','Interested domain'],['cgpa','CGPA'],['certLink','Certificate link']],miss=K.filter(k=>!s[k[0]]);
 return `<div class="box"><b>Welcome, ${esc(s.name)}</b><p style="margin-bottom:0">${esc(s.roll)} · ${esc(s.dept||'')} · Keep your profile complete and share your interview experiences.</p></div>

 ${two(pan('To complete in my profile',lst(miss.map(m=>m[1]))+'<div class="row">'+go('profile','Edit profile','id-card')+go('form','Add interview experience','comments')+'</div>'),pan('LeetCode',l?lst(['ID: '+esc(l.user||'-'),'Global rank: '+esc(l.gr||'-'),'Contest rank: '+esc(l.cr||'-'),'Easy / Medium / Hard: '+esc(l.e||'-')+' / '+esc(l.m||'-')+' / '+esc(l.h||'-')]):'<p style="margin:8px 0 0">Your LeetCode ID has not been added by the PC yet.</p>'))}

function landing(){const n=Object.keys(DB.st).length,L=Object.values(DB.lc),avg=L.length?Math.round(L.reduce((a,b)=>a+(+b.tot||0),0)/L.length):0,sum=k=>L.reduce((a,b)=>a+(+b[k]||0),0),mx=Math.max(sum('e'),sum('m'),sum('h'),1);

function auth(){const id=$('a1').value.trim(),pw=$('a2').value;msg='';

function table(cols,rows,act){return `<div class="tw"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${act?'<th></th>':''}</tr>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${/^https?:/.test(r[c[0]]||'')?`<a href="${esc(r[c[0]])}" target="_blank">link</a>`:esc(r[c[0]])}</td>`).join('')}${act?`<td>${act(r,i)}</td>`:''}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div>`}

 <b>${rows.length}</b> students${table(COLS,rows)}`}
function importCsv(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const R=csv(rd.result),h=R[0].map(x=>x.trim());let n=0;
 const m1={'Name with Initial After Name':'name','Roll No.':'roll','Technical Skills Strength':'skills','Mobile No.':'mobile','Hostel/Day Scholar':'hostel','Year':'year','Register No.':'regno','Dept':'dept','Gender':'gender','DOB':'dob','IT/Core':'itcore','Transport':'transport','10th Percentage':'p10','12th Percentage':'p12','Diploma Percentage':'diploma','CGPA out of 10':'cgpa','History of Arrears':'arrHist','Standing Arrears':'arrStand','Domain Mail ID':'dmail','Personal Mail ID':'pmail','Resume':'resume','1-Minute Video for Resume':'video','Portfolio Link':'portfolio','Interested Domain':'domain','Address':'address'};
 const m2={'CGPA':'cgpa','No of Internal Hackathon (Participated)':'ihP','No of Internal Hackathon (Won)':'ihW','No of External Hackathon (Participated)':'ehP','No of External Hackathon (Won)':'ehW','No of External Online Hackathon (Participated)':'eoP','No of External Online Hackathon (Won)':'eoW','External Intern Attended':'intern','Professional Certificate':'cert','Professional Certificate (Drive Link)':'certLink'};
 const d1=h.includes('Roll No.'),M=d1?m1:m2;
 R.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>{if(M[k])o[M[k]]=(r[i]||'').trim()});
  let t;if(d1)t=DB.st[(r[h.indexOf('Roll No.')]||'').trim().toUpperCase()];
  else{const rg=(r[h.indexOf('Register No.')]||'').trim(),nm=(r[h.indexOf('Name with Initial After Name')]||'').trim().toLowerCase();t=Object.values(DB.st).find(s=>s.regno==rg||(s.name||'').toLowerCase()==nm)}
  if(t){Object.assign(t,o);n++}});
 save();alert(n+' students updated (only allowed class rolls are matched).');render()};rd.readAsText(f)}
function vLeet(){const rows=Object.values(DB.lc).map(r=>({...r,name:(DB.st[r.roll]||{}).name})).filter(match);
 return `${ro()?'':`<div class="box"><b>Bulk add LeetCode IDs</b><br><small>Upload an Excel file (.xlsx, .xls or .csv) with columns: <b>Roll No., LeetCode ID</b>. Ranks and solved counts will be fetched later.</small><div class="row"><input type="file" accept=".xlsx,.xls,.csv" aria-label="Excel file" onchange="lcFile(this)"><button class="s" onclick="dl('leetcode-template.csv',[['Roll No.','LeetCode ID'],['24CS141','arun_k']])">${ic('download')}Download template</button></div></div>
 <details class="box" style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Add single student</summary><div class="grid"><div><label for="l_roll">Roll No.</label><select id="l_roll"><option value="">--</option>${ROLLS.map(r=>`<option>${r}</option>`).join('')}</select></div><div><label for="l_id">LeetCode ID</label><input id="l_id" placeholder="username"></div></div><div class="row"><button onclick="lcAdd()">Add / Update</button></div></details>`}
 ${search()}${table(LC,rows,ro()?null:r=>`<button class="d" onclick="delete DB.lc['${r.roll}'];save();render()"><i class="fa-solid fa-xmark"></i></button>`)}`}
function lcFile(el){const f=el.files[0];if(!f)return;if(typeof XLSX==='undefined')return alert('Excel reader failed to load. Check your connection.');
 const rd=new FileReader();rd.onload=()=>{let rows;try{const wb=XLSX.read(rd.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(e){return alert('Could not read this file.')}lcRows(rows)};rd.readAsArrayBuffer(f)}
function lcRows(rows){let n=0,sk=0;rows.forEach(row=>{const a=row.map(x=>String(x).trim());if(!a.some(x=>x)||/roll/i.test(a[0]))return;const r=a[0].toUpperCase();if(!DB.st[r]||!a[1]){sk++;return}
 DB.lc[r]=Object.assign(DB.lc[r]||{},{roll:r,user:a[1].replace(/\/+$/,'').split('/').pop()});n++});save();alert(n+' saved'+(sk?', '+sk+' skipped (roll not in class or ID missing)':''));render()}

function vIv(){const rows=DB.iv.filter(match);
 return `${search()}<b>${rows.length}</b> submissions`+rows.map(v=>`<div class="box" style="margin:10px 0"><b>${esc(v.company)}</b> <span class="tag">${esc(v.status)}</span> — ${esc(v.roll)} ${esc((DB.st[v.roll]||{}).name)} · ${v.rounds.length} round(s)
 ${roundsHtml(v.rounds)}<div><b>Experience:</b> ${esc(v.exp)}</div></div>`).join('')}
let lgS={k:'',d:1};

 let rows=all.map((r,i)=>({r,i})).filter(x=>match(x.r));
 if(lgS.k)rows.sort((a,b)=>{const x=a.r[lgS.k]??'',y=b.r[lgS.k]??'';return(x===''||y===''||isNaN(x)||isNaN(y)?String(x).localeCompare(String(y)):x-y)*lgS.d});
 const ed=k=>ro()?'':` class="ed" ondblclick="lgEdit(this,%I,'${k}')"`;
 return `<div class="stats">${[['circle-check','Total completed',done.length],['indian-rupee-sign','Total paid',paid.length+' (Rs. '+amt+')'],['hourglass-half','Paid but not taken exam',pend.length],['user-xmark','Not paid',all.length-paid.length]].map(x=>`<div class="box stat">${ic(x[0])}<b>${x[2]}</b><span>${x[1]}</span></div>`).join('')}</div>
 ${ro()?'':`<div class="box" style="margin-top:16px"><b>Bulk add Lingua Skills</b><br><small>Upload an Excel file (.xlsx, .xls or .csv) with columns: <b>Student Name, Roll No., Paid?, Amount, Exam Status, Slot, Result</b>. Existing roll numbers are updated.</small><div class="row"><input type="file" id="lgf" accept=".xlsx,.xls,.csv" aria-label="Excel file" onchange="lgFile(this)"><button class="s" onclick="dl('lingua-template.csv',[LG.map(c=>c[1]),['Arun Kumar S','24CS141','Yes',1500,'Completed','10 AM','Pass']])">${ic('download')}Download template</button></div></div>
 <<details class="box" style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Add single record</summary><div class="grid">
 <div><label>Roll No.</label><select id="g_roll" onchange="$('g_name').value=(DB.st[this.value]||{}).name||''"><option value="">--</option>${ROLLS.map(r=>`<option>${r}</option>`).join('')}</select></div>
 <div><label>Student Name</label><input id="g_name"></div><div><label>Paid?</label><select id="g_paid"><option>Yes</option><option>No</option></select></div>
 <div><label>Amount</label><input id="g_amt" type="number"></div><div><label>Exam Status</label><select id="g_exam"><option>Pending</option><option>Completed</option></select></div>
 <div><label>Slot</label><input id="g_slot" placeholder="10 AM"></div><div><label>Result</label><input id="g_res"></div></div><div class="row"><button onclick="lgAdd()">Add</button></div></details>`}
 ${search()}<small>${ro()?'':'Double-click a cell to edit. Tick the box to mark the exam completed. '}Click a column title to sort.</small>
 <div class="tw"><table><tr>${LG.map(c=>`<th class="sr" onclick="lgSort('${c[0]}')">${c[1]} ${lgS.k==c[0]?ic(lgS.d>0?'arrow-up':'arrow-down'):''}</th>`).join('')}${ro()?'':'<th></th>'}</tr>
 ${rows.map(({r,i})=>`<tr>${LG.map(c=>c[0]=='exam'?`<td><label style="margin:0;display:flex;gap:8px;align-items:center;font-weight:500;color:var(--t)"><input type="checkbox" ${isDone(r)?'checked':''} ${ro()?'disabled':''} onchange="lgTog(${i},this.checked)">${isDone(r)?'Completed':'Pending'}</label></td>`:`<td${ed(c[0]).replace('%I',i)}>${esc(r[c[0]])}</td>`).join('')}${ro()?'':`<td><button class="d" aria-label="Delete" onclick="lgDel(${i})">${ic('xmark')}</button></td>`}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div>`}
function lgSort(k){lgS=lgS.k==k?{k,d:-lgS.d}:{k,d:1};render()}
function lgTog(i,v){DB.lg[i].exam=v?'Completed':'Pending';save();render()}
function lgEdit(td,i,k){if(td.querySelector('input,select'))return;const v=DB.lg[i][k]??'',el=document.createElement(k=='paid'?'select':'input');
 if(k=='paid'){['Yes','No'].forEach(o=>{const op=document.createElement('option');op.textContent=o;el.appendChild(op)})}else if(k=='amt')el.type='number';
 el.value=v;td.textContent='';td.appendChild(el);el.focus();
 el.onblur=()=>{DB.lg[i][k]=el.value;save();render()};el.onkeydown=e=>{if(e.key=='Enter')el.blur();if(e.key=='Escape'){el.onblur=null;render()}}}
function lgFile(el){const f=el.files[0];if(!f)return;if(typeof XLSX==='undefined')return alert('Excel reader failed to load. Check your connection.');
 const rd=new FileReader();rd.onload=()=>{let rows;try{const wb=XLSX.read(rd.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(e){return alert('Could not read this file.')}lgRows(rows)};rd.readAsArrayBuffer(f)}
function lgRows(rows){let n=0,sk=0;rows.forEach(row=>{const a=row.map(x=>String(x).trim());if(!a.some(x=>x)||/student name/i.test(a[0]))return;const r=(a[1]||'').toUpperCase();if(!DB.st[r]){sk++;return}
 const o={name:a[0]||DB.st[r].name,roll:r,paid:/^(yes|y|paid|true|1)$/i.test(a[2])?'Yes':'No',amt:a[3]||'',exam:/^(completed?|yes|done|attended|true|1)$/i.test(a[4])?'Completed':'Pending',slot:a[5]||'',res:a[6]||''};
 const i=DB.lg.findIndex(x=>x.roll===r);if(i>=0)DB.lg[i]=o;else DB.lg.push(o);n++});save();alert(n+' saved'+(sk?', '+sk+' skipped (roll not in class)':''));render()}
